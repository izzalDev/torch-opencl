name: CI Run Test
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.10"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up OpenCL
        uses: izzalDev/setup-opencl@v1
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: ${{ matrix.python-version }}
      - name: Restore cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
            ~/work/_temp/setup-uv-cache
            .venv
            build
          key: cache-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock', 'CMakeLists.txt', 'pyproject.toml') }}-${{ hashFiles('src/**/*') }}
          restore-keys: |
            cache-${{ runner.os }}-${{ matrix.python-version }}-
      - name: Run tests
        run: uv run pytest -v --ignore=apt-cache --junitxml=test-results/results.xml
      - name: Publish test results
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: test-results/results.xml
          check_name: "Test (${{ matrix.os }}, Python ${{ matrix.python-version }})"
          include_passed: true
          detailed_summary: true
          annotate_only: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Save cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
            ~/work/_temp/setup-uv-cache
            .venv
            build
          key: cache-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock', 'CMakeLists.txt', 'pyproject.toml') }}-${{ hashFiles('src/**/*') }}
