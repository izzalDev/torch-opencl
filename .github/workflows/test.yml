name: Test
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PoCL
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pocl-opencl-icd clinfo
          clinfo -l

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Get uv cache dir
        id: uv-cache
        shell: bash
        run: |
          UV_DIR=$(uv cache dir)
          echo "dir=$UV_DIR" >> $GITHUB_OUTPUT

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.uv-cache.outputs.dir }}
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('src/**/*.{cpp,h,hpp}', 'CMakeLists.txt', 'pyproject.toml') }}
          restore-keys: |
            build-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: uv sync --all-extras --dev --no-install-workspace

      - name: Build and Install torch-opencl
        run: uv pip install -e . -v

      - name: Run tests
        run: uv run pytest -v
