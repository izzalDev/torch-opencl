name: Test

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install OpenCL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y opencl-headers ocl-icd-opencl-dev pocl-opencl-icd

      - name: Install OpenCL (macOS)
        if: runner.os == 'macOS'
        run: echo "OpenCL is built-in on macOS via Frameworks, no install needed."

      - name: Install OpenCL (Windows)
        if: runner.os == 'Windows'
        run: choco install opencl-intel-cpu-runtime -y
        continue-on-error: true

      - name: Run tests
        run: uv run pytest tests/ -v
