[project]
name = "torch-opencl"
version = "0.1.0"
description = "A Python extension that integrates PyTorch with OpenCL, enabling GPU acceleration via the OpenCL API."
readme = "README.md"
authors = [{ name = "izzalDev", email = "rizal.fadlullah@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy<2.4", "torch>=2.11"]

[tool.scikit-build]
build-dir = "build"

[tool.scikit-build-core-conan]
settings-all = ["compiler.cppstd=17"]
output-dir = "build"

[tool.uv]
cache-keys = [
	{ file = "pyproject.toml" },
	{ file = "csrc/**/*.{h,c,hpp,cpp}" },
	{ file = "CMakeLists.txt" },
	{ file = "conanfile.txt" },
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["torch>=2.11", "scikit-build-core-conan>=0.9.2"]
build-backend = "scikit_build_core_conan.build"

[dependency-groups]
dev = ["pyopencl>=2026.1.2", "pytest>=9.0", "scikit-build-core-conan>=0.9.2"]
