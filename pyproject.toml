[project]
name = "torch-opencl"
description = "Experimental PyTorch backend using OpenCL and PrivateUse1 integration."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "izzalDev", email = "rizal.fadlullah@gmail.com" }]
dynamic = ["version"]

dependencies = [
  "nanobind",
  "numpy<2.4",
  "torch>=2.6",
]

[project.entry-points."torch.backends"]
opencl = "torch_opencl:_autoload"

[dependency-groups]
dev = [
  "nanobind>=2.12.0",
  "pre-commit>=4.6.0",
  "pytest>=9.0",
  "scikit-build-core-conan>=0.9",
  "setuptools-scm>=8.0",
]

[build-system]
requires = [
  "nanobind",
  "scikit-build-core-conan",
  "setuptools-scm",
  "torch",
]
build-backend = "scikit_build_core_conan.build"

[tool.pyright]
include = ["torch_opencl", "tests"]
exclude = ["**/node_modules", "**/__pycache__", "build", "**/_deps"]
reportPrivateImportUsage = "none"
venvPath = "."
venv = ".venv"

[tool.scikit-build]
build-dir = "build"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.scikit-build-core-conan]
output-folder = "build"

[tool.setuptools_scm]
fallback_version = "0.1.0-dev"
local_scheme = "no-local-version"

[tool.scikit-build-core-conan]
settings-all = ["compiler.cppstd=17"]
output-dir = "build"

[tool.uv]
no-build-isolation-package = ["torch-opencl"]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "csrc/**/*.{h,c,hpp,cpp}" },
  { file = "CMakeLists.txt" },
  { file = "conanfile.txt" },
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
nanobind = { git = "https://github.com/Doekin/nanobind.git", rev = "stubgen_win_dll" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
