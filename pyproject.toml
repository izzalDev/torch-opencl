[project]
name = "torch-opencl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "izzalDev", email = "rizal.fadlullah@gmail.com" }]
dependencies = ["numpy<2.4", "torch>=2.11"]

[dependency-groups]
dev = [
	"nanobind>=2.12.0",
	"pre-commit>=4.6.0",
	"pytest>=9.0",
	"scikit-build-core-conan>=0.9",
]

[build-system]
requires = ["nanobind>=2.12.0", "scikit-build-core-conan>=0.9", "torch>=2.11"]
build-backend = "scikit_build_core_conan.build"

[tool.pyright]
include = ["torch_opencl", "tests"]
exclude = ["**/node_modules", "**/__pycache__", "build", "**/_deps"]
reportPrivateImportUsage = "none"
venvPath = "."
venv = ".venv"

[tool.scikit-build]
build-dir = "build"

[tool.scikit-build-core-conan]
output-folder = "build"

[tool.uv]
no-build-isolation-package = ["torch-opencl"]
cache-keys = [
	{ file = "pyproject.toml" },
	{ file = "csrc/**/*.{h,c,hpp,cpp}" },
	{ file = "CMakeLists.txt" },
	{ file = "conanfile.txt" },
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
